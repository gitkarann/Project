<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>OpenWeatherMap Api</title>
  <link rel="stylesheet" href="weatherApp_2329860_Karan Sah.css">
</head>
<body>
  <div class="main">
    <div class="header">
      <h1>OpenWeatherMap API</h1>
      <p>City Name is to be Entered for Weather Description</p>
    </div>
  
    <div class="input">
      <input type="text" placeholder="Enter the city" class="input_text">
      <input type="submit" value="Submit" class="submit">
    </div>
  </div>

  <div class="container">
    <div class="card">
      <h1 class="name" id="name"></h1>
      <p class="temp"></p>
      <p class="wind"></p>
      <p class="humid"></p>
      <p class="clouds"></p>
      <p class="desc"></p>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <h1 class="name" id="bolton-name"></h1>
      <p class="temp" id="bolton-temp"></p>
      <p class="wind" id="bolton-wind"></p>
      <p class="humid" id="bolton-humid"></p>
      <p class="clouds" id="bolton-clouds"></p>
      <p class="desc" id="bolton-desc"></p>
    </div>
  </div>
 
  <script src="weatherApp_2329860_Karan Sah.js"></script>
</body>
</html>
